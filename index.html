<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kira accesories</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    </head>

    <a
    href="https://wa.me/5492226626230"
    class="whatsapp-float"
    target="_blank"
    aria-label="Contactar por WhatsApp"
    >
      <img
        src="media/WhatsAppLogo.svg"
        alt="WhatsApp"
      />
    </a>

    <body class="background">

      <!-- Navbar -->
      <nav class="navbar navbar-dark bg-dark sticky-top px-3">

    <!-- Logo -->
  <img
    src="media/logoKira.png"
    id="logo"
    alt="logo"
    width="60px"
    height="55px"
  />

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <img src="media/logoKira.png" alt="logo grande">
  </div>


    <!-- Buscador + filtros (desktop) -->
    <div class="d-flex align-items-center gapBuscador">
      <input
        type="search"
        class="form-control"
        placeholder="Buscar"
        style="max-width: 260px;"
        id="buscador"
      >
      <button
        class="botonFiltro"
        data-bs-toggle="modal"
        data-bs-target="#modalFiltros"
      >
      <img src="media/iconoFiltro.png" alt="" width="30" height="30"/>
      </button>
    </div>

    <!-- Botón menú -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#menuDerecho"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
  </nav>

  <!-- MODAL FILTROS -->
  <div class="modal fade" id="modalFiltros" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <form>
          <div class="modal-header">
            <h5 class="modal-title">Filtros</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <div class="mb-3">
              <label class="form-label">Precio</label>
              <div class="d-flex gap-2">
                <input type="number" class="form-control" placeholder="Mín" id="precioMin">
                <input type="number" class="form-control" placeholder="Máx" id="precioMax">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Talle</label>
              <select class="form-select" id="talle">
                <option>Cualquiera</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="tipo">
                <option>Cualquiera</option>
                <option>Remera</option>
                <option>Buzo</option>
                <option>Campera</option>
              </select>
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" id = "botonReiniciar" class="btn btn-secondary">Limpiar</button>
            <button type="submit" class="btn btn-success">Aplicar</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- OFFCANVAS -->
  <div class="offcanvas offcanvas-end text-bg-dark menuDerecha" id="menuDerecho">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title text-pink">Menú principal</h5>
      <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
      <ul class="navbar-nav fs-5 justify-content-evenly">
        <li class="nav-item">
          <a class="nav-link" href="#">Sobre nosotros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contacto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Instagram</a>
        </li>
      </ul>
    </div>
  </div>


        <!-- Contenido principal -->
        <div class="pt-5 pb-4" id="titulo">
            <h1 class="text-center animate__animated animate__rubberBand resaltado text-white fuente ">Kira accesories</h1>
        </div>

        <!-- Cards -->
        <main class="d-flex justify-content-center mb-3" id="menu">                     <!-- ACA VAN LAS TARJETAS -->
        </main>

        <footer class="bg-dark text-white fs-5 p-3" id="footer">
            Kira accesories - No se recogen datos personales
        </footer>

        <script src="js/main.js"></script>
        <!-- <script src="https://code.jquery.com/jquery-3.3.1.slim. min.js"></script> -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    </body>
</html>
